[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nostalgic-moments-backend"
version = "0.1.0"
description = "Immersive Nostalgic Music Experience Platform Backend API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.8.0",
    "pwdlib[bcrypt]>=0.2.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1"
]
